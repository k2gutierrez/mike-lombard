version: 1
# AWS Amplify Hosting build for a Next.js 16 App Router project (SSR).
# Region, branch and environment variables are configured in the Amplify console.
#
# WHY `.env.production` IS WRITTEN HERE (do not remove):
# Amplify keeps console environment variables in the *build* environment. A
# Next.js server component does NOT see them at runtime by default - that is
# intentional, so build-time secrets are not exposed to the SSR compute. The
# documented way to pass them to the server is to write them into an environment
# file that Next.js loads, before the build runs:
# https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
#
# Symptom if this step is missing: the public site renders, but /admin shows
# "Demo mode. Supabase is not configured..." and no sign-in is possible.
#
# YAML RULES FOR THIS FILE (learned the hard way, two failed builds):
#   * every command is a single-quoted string;
#   * no "${...}" expansions, and no ": " inside a command. An unquoted ${!var}
#     indirection produced "bad indentation of a mapping entry", and a literal
#     "KEY: value" inside a command produced "nested mappings are not allowed in
#     compact mappings". Validate the file after any edit.
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node 22. `.nvmrc` pins it for local tooling too.
        - 'nvm use 22 || nvm install 22'
        - 'node -v'
        - 'npm -v'
        # `npm ci` is the correct, reproducible install. It is validated strictly
        # against package-lock.json, so a lockfile generated by a different npm
        # major, or one left half-resolved after editing dependencies, fails with
        # "Missing: <pkg> from lock file". The fallback keeps a deploy moving
        # instead of stopping the build; it is not the default path.
        - 'npm ci --no-audit --no-fund || npm install --no-audit --no-fund'
    build:
      commands:
        # 1. Hand the variables to Next.js at runtime. Server-only secrets are
        #    included on purpose: without them the admin panel cannot save or
        #    publish. They are read on the server and never shipped to the
        #    browser bundle.
        - 'rm -f .env.production'
        - "env | grep -E '^(NEXT_PUBLIC_[A-Z0-9_]+|SUPABASE_[A-Z0-9_]+|APP_ORIGIN|ML_[A-Z0-9_]+)=' >> .env.production"
        - 'echo "vars written to .env.production -> $(wc -l < .env.production)"'
        # 2. Say which ones arrived, without printing any value.
        - "grep -oE '^[A-Z0-9_]+' .env.production | sort | tr '\\n' ' '"
        # 3. Fail loudly instead of deploying a site that runs in demo mode.
        - 'test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo FATAL-missing-NEXT_PUBLIC_SUPABASE_URL && exit 1)'
        - 'test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || (echo FATAL-missing-NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY && exit 1)'
        - 'test -n "$SUPABASE_SERVICE_ROLE_KEY" && echo service-role-key-present || echo NOTE-service-role-key-absent-at-build'
        - 'npm run build'
  artifacts:
    # Amplify's Next.js support reads the build output and the static assets.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - 'node_modules/**/*'
      - '.next/cache/**/*'
