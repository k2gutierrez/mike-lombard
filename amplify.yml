version: 1
# AWS Amplify Hosting build for a Next.js 16 App Router project (SSR).
# Region, branch and environment variables are configured in the Amplify console.
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node 22. `.nvmrc` pins it for local tooling too.
        - nvm use 22 || nvm install 22
        - node -v
        - npm -v
        # `npm ci` is the correct, reproducible install. It is validated strictly
        # against package-lock.json, so a lockfile generated by a different npm
        # major — or one left half-resolved after editing dependencies — fails
        # with "Missing: <pkg> from lock file". The fallback keeps a deploy
        # moving instead of stopping the build; it is not the default path.
        - npm ci --no-audit --no-fund || npm install --no-audit --no-fund
    build:
      commands:
        - env | grep -E '^(NEXT_PUBLIC_|APP_ORIGIN|ML_|SUPABASE_)' | sed 's/=.*/=<set>/' || true
        - npm run build
  artifacts:
    # Amplify's Next.js support reads the build output and the static assets.
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
