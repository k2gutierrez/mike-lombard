version: 1
# AWS Amplify Hosting build for a Next.js 16 App Router project (SSR).
# Region, branch and environment variables are configured in the Amplify console.
#
# WHY `.env.production` IS WRITTEN HERE (do not remove):
# Amplify keeps console environment variables in the *build* environment. A
# Next.js server component does NOT see them at runtime by default — that is
# intentional, so build-time secrets are not exposed to the SSR compute. The
# documented way to pass them to the server is to write them into an environment
# file that Next.js loads, before the build runs:
# https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
#
# Symptom if this step is missing: the public site renders, but /admin shows
# "Demo mode. Supabase is not configured…" and no sign-in is possible, because
# `hasSupabaseService` resolves to false on the server.
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 needs Node 22. `.nvmrc` pins it for local tooling too.
        - nvm use 22 || nvm install 22
        - node -v
        - npm -v
        # `npm ci` is the correct, reproducible install. It is validated strictly
        # against package-lock.json, so a lockfile generated by a different npm
        # major — or one left half-resolved after editing dependencies — fails
        # with "Missing: <pkg> from lock file". The fallback keeps a deploy
        # moving instead of stopping the build; it is not the default path.
        - npm ci --no-audit --no-fund || npm install --no-audit --no-fund
    build:
      commands:
        # 1. Report which expected variables are present, without printing values.
        - for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SITE_URL APP_ORIGIN ML_ADMIN_EMAILS ML_AUTH_MODE ML_HASH_SALT NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID; do if [ -n "${!v}" ]; then echo "env $v: set"; else echo "env $v: MISSING"; fi; done
        # 2. Hand them to Next.js at runtime. Server-only secrets are included on
        #    purpose: without them the admin panel cannot save or publish. They
        #    are read on the server and never shipped to the browser bundle.
        - rm -f .env.production
        - env | grep -E '^(NEXT_PUBLIC_[A-Z0-9_]+|SUPABASE_[A-Z0-9_]+|APP_ORIGIN|ML_[A-Z0-9_]+)=' >> .env.production
        - echo "vars written to .env.production: $(wc -l < .env.production)"
        # 3. Fail loudly instead of deploying a site that silently runs in demo mode.
        - test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "FATAL: NEXT_PUBLIC_SUPABASE_URL is not set in Amplify"; exit 1)
        - test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || (echo "FATAL: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is not set in Amplify"; exit 1)
        - npm run build
  artifacts:
    # Amplify's Next.js support reads the build output and the static assets.
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
